services:
  api:
    build:
      context: .
    container_name: nationmusics-test-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:mysql://barbershop-mysql:3306/nationmusics_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DATABASE_USERNAME: nationmusics_test
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_OPEN_IN_VIEW: "false"
      YT_DLP_PATH: /usr/local/bin/yt-dlp
      FFMPEG_PATH: /usr/bin
      JAVA_TOOL_OPTIONS: -Xms96m -Xmx384m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -Duser.timezone=America/Sao_Paulo
      TZ: America/Sao_Paulo
    ports:
      - 127.0.0.1:8090:8080
    volumes:
      - nationmusics-downloads:/app/downloads
    networks:
      - barbershop
    mem_limit: 640m
    mem_reservation: 256m
    cpus: 1.0
    pids_limit: 160
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"

volumes:
  nationmusics-downloads:
    name: nationmusics-test-downloads

networks:
  barbershop:
    external: true
    name: barbershop-site_default
