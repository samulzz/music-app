# Optional IP-only downloads. No API, directory listing or administrative routes.
# These HTTP URLs are not a replacement for HTTPS or Android store distribution.
server {
    listen 80;
    listen [::]:80;
    server_name 38.18.230.83;

    location = /nationmusics/download/nationmusics.apk {
        alias /opt/nationmusics-test/public/nationmusics.apk;
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="nationmusics.apk"' always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /nationmusics/download/NationMusics-Setup.exe {
        alias /opt/nationmusics-test/public/NationMusics-Setup.exe;
        types { }
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="NationMusics-Setup.exe"' always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / { return 404; }
}
